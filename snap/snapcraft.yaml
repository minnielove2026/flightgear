name: flightgear
base: core24
version: "2024.1.5"
summary: Open source flight simulator
description: |
  FlightGear is a free, open source flight simulator with a wide range of
  aircraft, launch options, and scenery support.
grade: stable
confinement: strict
compression: lzo

apps:
  flightgear:
    command: bin/launch-flightgear
    desktop: usr/share/applications/org.flightgear.FlightGear.desktop
    extensions: [gnome]
    environment:
      FG_HOME: $SNAP_USER_DATA/.fgfs
      OSG_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/osgPlugins-3.6.5
    plugs:
      - audio-playback
      - home
      - joystick
      - network
      - network-bind
      - opengl
      - removable-media

parts:
  fgdata:
    plugin: dump
    source: https://mirrors.ibiblio.org/flightgear/ftp/release-2024.1/FlightGear-2024.1.5-data.txz
    source-type: tar
    organize:
      "*": fgdata/

  simgear:
    plugin: cmake
    source: https://gitlab.com/flightgear/simgear/-/archive/2024.1.5/simgear-2024.1.5.tar.bz2
    build-packages:
      - cmake
      - ninja-build
      - pkg-config
      - libboost-dev
      - libcurl4-openssl-dev
      - libexpat1-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - liblzma-dev
      - libopenal-dev
      - libopenscenegraph-dev
      - libc-ares-dev
      - zlib1g-dev
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      - -DSYSTEM_EXPAT=ON
      - -DENABLE_CYCLONE=OFF
      - -DENABLE_TESTS=OFF
      - -DENABLE_VIDEO_RECORD=OFF

  flightgear:
    after: [simgear]
    plugin: cmake
    source: https://gitlab.com/flightgear/flightgear/-/archive/2024.1.5/flightgear-2024.1.5.tar.bz2
    build-packages:
      - cmake
      - ninja-build
      - pkg-config
      - libboost-dev
      - libcurl4-openssl-dev
      - libdbus-1-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - liblzma-dev
      - libopenal-dev
      - libopenscenegraph-dev
      - libplib-dev
      - libsqlite3-dev
      - libudev-dev
      - libx11-dev
      - libxkbcommon-dev
      - libxkbcommon-x11-dev
      - qt6-base-dev
      - qt6-declarative-dev
      - qt6-svg-dev
      - qt6-tools-dev
    stage-packages:
      - libasound2t64
      - libc-ares2
      - libcurl4t64
      - libdbus-1-3
      - libgdal34t64
      - libglu1-mesa
      - liblzma5
      - libopenal1
      - libopenscenegraph161
      - libopenthreads21
      - libplib1t64
      - libpulse0
      - libsqlite3-0
      - libudev1
      - libx11-6
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - zlib1g
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      - -DCMAKE_PREFIX_PATH=$CRAFT_STAGE/usr
      - -DCHECK_FOR_QT5=OFF
      - -DCHECK_FOR_QT6=ON
      - -DENABLE_VR=OFF
      - -DENABLE_SWIFT=OFF
      - -DENABLE_SENTRY=OFF
      - -DENABLE_HID_INPUT=OFF
      - -DSYSTEM_SQLITE=ON
    override-prime: |
      craftctl default
      sed -i 's|^Exec=.*|Exec=flightgear|g' "$CRAFT_PRIME/usr/share/applications/org.flightgear.FlightGear.desktop"
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/lib/*/pkgconfig
      - -usr/share/doc
      - -usr/share/man

  launcher:
    plugin: dump
    source: snap/local
    organize:
      launch-flightgear: bin/launch-flightgear
